<div class="page-shell">
  <header>
    <h1>BSP</h1>
  </header>

  <main class="forgot-container">
    <div class="forgot-card">
      <h2>Restablecer contraseña</h2>

      <p *ngIf="!tokenPresente" class="field-error">
        Este enlace no es válido o está incompleto. Solicita uno nuevo desde
        <a routerLink="/password-change">¿Olvidaste tu contraseña?</a>
      </p>

      <ng-container *ngIf="tokenPresente">
        <p>Ingresa tu nueva contraseña para continuar.</p>

        <form (ngSubmit)="onSubmit()" #form="ngForm">
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Nueva contraseña"
            required
            minlength="8"
            #passField="ngModel"
          />
          <small class="field-error" *ngIf="passField.invalid && passField.touched">
            Usa al menos 8 caracteres.
          </small>

          <input
            type="password"
            [(ngModel)]="confirmacion"
            name="confirmacion"
            placeholder="Confirma la contraseña"
            required
          />
          <small class="field-error" *ngIf="confirmacion && !coinciden">
            Las contraseñas no coinciden.
          </small>

          <button type="submit" [disabled]="!form.valid || !coinciden || enviando">
            {{ enviando ? 'Guardando…' : 'Guardar' }}
          </button>
        </form>
      </ng-container>

      <p class="back"><a routerLink="/login">Volver al login</a></p>
    </div>
  </main>
</div>
