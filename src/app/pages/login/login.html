<div class="page-shell">
  <main class="page">
    <section class="auth-panel">
      <header class="brand">
        <img src="assets/bspLogo.png" alt="Logo BSP Union" class="brand__logo" />
      </header>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="text-field">
          <label for="email" class="text-field__label">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Ingresa tu email"
            class="text-field__input"
            required
            email
            #emailField="ngModel"
          />
          <small class="field-error" *ngIf="emailField.invalid && emailField.touched">
            Ingresa un correo válido.
          </small>
        </div>

        <div class="text-field">
          <label for="passwordUser" class="text-field__label">Password</label>
          <input
            id="passwordUser"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Password"
            class="text-field__input"
            required
          />
        </div>

        <div class="form-actions">
          <a routerLink="/password-change" class="link-accent">¿Olvidaste tu contraseña?</a>

          <button type="submit" class="btn" [disabled]="!loginForm.valid || enviando">
            <img src="assets/star.svg" alt="" class="btn__icon" />
            <span class="btn__label">{{ enviando ? 'Entrando…' : 'LOG IN' }}</span>
          </button>

          <button
            type="button"
            class="btn btn--bio"
            *ngIf="biometricEnabled"
            (click)="loginBiometrico()"
            [disabled]="enviando"
          >
            <span class="btn__label">Iniciar sesión con huella</span>
          </button>
        </div>
      </form>

      <div class="form-footer">
        <p>¿No tienes una cuenta?</p>
        <a routerLink="/formulario" class="link-accent">Regístrate</a>
      </div>

      <footer class="legal">
        <p>Banco gestionado por Rudebboyz Finance Services</p>
        <p>Términos y condiciones <a href="#" class="link-accent">aquí</a>.</p>
      </footer>
    </section>

    <aside class="hero">
      <img src="assets/image2.png" alt="Imagen de bienvenida" class="hero__bg" />
      <div class="hero-text">
        <h1 class="auth-title">Bienvenido a <strong>BSP Union</strong></h1>
        <p class="auth-subtitle">Ingresa tus datos para acceder a tu cuenta</p>
      </div>
      <img src="assets/image6.png" alt="" class="hero__shape hero__shape--tl" />
      <img src="assets/image5.png" alt="" class="hero__shape hero__shape--br" />
    </aside>
  </main>
</div>
