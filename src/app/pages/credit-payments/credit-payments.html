<div class="page-shell">
  <header>
    <h1>BSP</h1>
    <div class="user" *ngIf="cliente">
      <div class="avatar">{{ cliente.iniciales }}</div>
      <div class="userinfo">
        <p>{{ cliente.nombre }}</p>
        <p>{{ cliente.nivel }}</p>
      </div>
      <button (click)="onLogout()" class="logout-button">Logout</button>
    </div>
  </header>

  <div class="container">
    <h2>Pagos del Crédito</h2>

    <div class="pago-card">
      <label for="montoPago">Monto del pago:</label>
      <input
        id="montoPago"
        type="number"
        name="montoPago"
        [(ngModel)]="montoPago"
        min="1"
        placeholder="Ej: 500"
      />
      <button class="btn" (click)="pagar()" [disabled]="!montoValido || pagando">
        {{ pagando ? 'Procesando…' : 'Pagar' }}
      </button>
    </div>

    <p *ngIf="loading">Cargando pagos…</p>

    <table *ngIf="!loading && payments.length > 0">
      <thead>
        <tr>
          <th>Monto</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of payments">
          <td>{{ p.monto | currency:'MXN' }}</td>
          <td>{{ p.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="!loading && payments.length === 0" class="alert">
      No hay pagos realizados aún.
    </p>

    <button class="btn secondary" (click)="volver()">Volver al crédito</button>
  </div>
</div>
