<div class="page-shell">
  <header>
    <h1>BSP</h1>
  </header>

  <main class="forgot-container">
    <div class="forgot-card">
      <h2>¿Olvidaste tu contraseña?</h2>
      <p>Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace para restablecerla.</p>

      <form (ngSubmit)="onSubmit()" #form="ngForm" *ngIf="!enviado">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Correo electrónico"
          required
          email
        />
        <button type="submit" [disabled]="!form.valid || enviando">
          {{ enviando ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>

      <p class="sent" *ngIf="enviado">
        Si ese correo está registrado, recibirás un enlace en los próximos minutos.
        El enlace expira en 15 minutos.
      </p>

      <p class="back"><a routerLink="/login">Volver al login</a></p>
    </div>
  </main>
</div>
